# Deployment manifests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-mlops-api
  labels:
    app: llm-mlops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-mlops-api
  template:
    metadata:
      labels:
        app: llm-mlops-api
    spec:
      containers:
      - name: api
        image: llm-mlops-platform:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llm-mlops-service
spec:
  selector:
    app: llm-mlops-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer